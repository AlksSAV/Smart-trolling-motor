; Smart Trolling Motor - PlatformIO configuration
; Hardware registry: docs/equipment.md
; Pin assignment: docs/pinmap.md
; Build/flash guide: docs/platformio.md

[platformio]
name = smart-trolling-motor
src_dir = src

[env:esp32s3]
platform = espressif32@55.3.311
framework = arduino
board = esp32-s3-devkitc-1

monitor_speed = 115200
upload_speed = 460800

; Board JSON in platform 6.10.0 describes N8 variant (8 MB flash, no PSRAM).
; Real module is N16R8: 16 MB flash, 8 MB octal PSRAM. Overrides below.
; Verify by serial output after first flash - docs/platformio.md.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs

; Native USB: Serial goes to USB CDC, not UART0.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
